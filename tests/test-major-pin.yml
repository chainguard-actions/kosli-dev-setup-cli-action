name: Test major version pin resolution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2"
      - name: Assert version output is set and starts with major version
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          if [ "$MAJOR" != "2" ]; then
            echo "FAIL: expected major version '2' but got '$MAJOR' (full version: '$VERSION')"
            exit 1
          fi
          echo "PASS: resolved version '$VERSION' starts with major '2'"
      - name: Assert kosli binary is on PATH
        run: |
          if ! command -v kosli >/dev/null 2>&1; then
            echo "FAIL: kosli binary not found on PATH"
            exit 1
          fi
          echo "PASS: kosli found at $(command -v kosli)"
      - name: Assert installed version matches resolved version
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          INSTALLED="$(kosli version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "installed version: $INSTALLED"
          echo "expected version: $VERSION"
          if [ -z "$INSTALLED" ]; then
            echo "WARN: could not parse installed version, skipping version match check"
          else
            if [ "$INSTALLED" != "$VERSION" ]; then
              echo "FAIL: installed version '$INSTALLED' does not match output '$VERSION'"
              exit 1
            fi
          fi
          echo "PASS"
