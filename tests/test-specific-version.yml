name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.11.4"
      - name: Assert version output matches requested version
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "2.11.4" ]; then
            echo "FAIL: expected version '2.11.4' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version output is '$VERSION'"
      - name: Assert kosli binary is on PATH
        run: |
          if ! command -v kosli >/dev/null 2>&1; then
            echo "FAIL: kosli binary not found on PATH"
            exit 1
          fi
          echo "PASS: kosli found at $(command -v kosli)"
      - name: Assert installed version matches requested version
        run: |
          INSTALLED="$(kosli version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "2.11.4" ]; then
            echo "FAIL: installed version '$INSTALLED' does not match expected '2.11.4'"
            exit 1
          fi
          echo "PASS"
